<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>탄막 게임 - 모바일</title>

    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

        }

        /* =================================

        #gameContainer {
            position: relative;

            width: min(500px, 100vw);

            aspect-ratio: 500 / 650;

            overflow: hidden;

</head>

<body>

<div id="gameContainer">

    <!-- =================================
         게임 화면
    ================================= -->

    <canvas
        id="gameCanvas"
        width="500"
        height="650">
    </canvas>


    <!-- =================================
         시작 화면
    ================================= -->

    <div id="startScreen">

        <div id="startTitle">
            BULLET HELL
        </div>

        <button id="startButton">
            START GAME
        </button>

    </div>


    <!-- =================================
         조이스틱
    ================================= -->

    <div id="joystick">

        <div id="joystickKnob"></div>

    </div>


    <!-- =================================
         패링 버튼
    ================================= -->

    <button id="parryButton">
        PARRY
    </button>


    <!-- =================================
         게임 오버
    ================================= -->

    <div id="gameOverScreen">

        <div id="gameOverTitle">
            GAME OVER
        </div>

        <div id="finalScore">
            최종 점수: 0
        </div>

        <button id="restartButton">
            RESTART
        </button>

    </div>

</div>


<script>

    /* =========================================
       기본 설정
    ========================================= */

    const canvas =
        document.getElementById("gameCanvas");

    const ctx =
        canvas.getContext("2d");


    /* =========================================
       화면 요소
    ========================================= */

    const startScreen =
        document.getElementById("startScreen");

    const startButton =
        document.getElementById("startButton");

    const joystick =
        document.getElementById("joystick");

    const joystickKnob =
        document.getElementById("joystickKnob");

    const parryButton =
        document.getElementById("parryButton");

    const gameOverScreen =
        document.getElementById("gameOverScreen");

    const finalScore =
        document.getElementById("finalScore");

    const restartButton =
        document.getElementById("restartButton");


    /* =========================================
       플레이어
    ========================================= */

    let player = {

        // 500 × 650 공간의 아래쪽 중앙
        x: 250,

        y: 580,

        radius: 8,

        // 플레이어 고정 이동 속도
        speed: 3
    };


    /* =========================================
       게임 변수
    ========================================= */

    let bullets = [];

    let scorePopups = [];

    let score = 0;

    let isGameStarted = false;

    let isGameOver = false;


    /* =========================================
       조이스틱
    ========================================= */

    let joystickX = 0;

    let joystickY = 0;

    let joystickActive = false;

    let joystickPointerId = null;

    /*
       90 × 90 조이스틱이므로
       움직일 수 있는 반지름은 45
    */

    const joystickRadius = 45;


    /* =========================================
       패링
    ========================================= */

    let parry = {

        active: false,

        cooldown: false,

        rewarded: false,

        radius: 25,

        duration: 15,

        cooldownTime: 70,

        timer: 0,

        cdTimer: 0,

        combo: 0,

        comboTimer: 0,

        maxComboTimer: 210
    };


    /* =========================================
       게임 시작
    ========================================= */

    startButton.addEventListener(
        "click",
        startGame
    );


    function startGame() {

        isGameStarted = true;

        isGameOver = false;

        startScreen.style.display = "none";

        joystick.style.display = "block";

        parryButton.style.display = "block";

        resetGame();

        requestAnimationFrame(update);
    }


    /* =========================================
       게임 초기화
    ========================================= */

    function resetGame() {

        player.x = 250;

        player.y = 580;

        bullets = [];

        scorePopups = [];

        score = 0;

        isGameOver = false;


        parry.active = false;

        parry.cooldown = false;

        parry.rewarded = false;

        parry.timer = 0;

        parry.cdTimer = 0;

        parry.combo = 0;

        parry.comboTimer = 0;


        joystickX = 0;

        joystickY = 0;

        joystickActive = false;

        joystickPointerId = null;


        joystickKnob.style.transform =
            "translate(-50%, -50%)";


        draw();
    }


    /* =========================================
       게임 오버
    ========================================= */

    function gameOver() {

        isGameOver = true;

        joystick.style.display = "none";

        parryButton.style.display = "none";

        finalScore.textContent =
            "최종 점수: " + score;

        gameOverScreen.style.display = "flex";
    }


    /* =========================================
       재시작
    ========================================= */

    restartButton.addEventListener(
        "click",
        function() {

            gameOverScreen.style.display =
                "none";

            joystick.style.display =
                "block";

            parryButton.style.display =
                "block";

            resetGame();

            requestAnimationFrame(update);
        }
    );


    /* =========================================
       조이스틱 터치 시작
    ========================================= */

    joystick.addEventListener(
        "pointerdown",
        function(e) {

            if (
                !isGameStarted ||
                isGameOver
            ) {
                return;
            }

            joystickActive = true;

            joystickPointerId =
                e.pointerId;

            joystick.setPointerCapture(
                e.pointerId
            );

            updateJoystick(e);
        }
    );


    /* =========================================
       조이스틱 움직이기
    ========================================= */

    joystick.addEventListener(
        "pointermove",
        function(e) {

            if (!joystickActive) {
                return;
            }

            if (
                e.pointerId !==
                joystickPointerId
            ) {
                return;
            }

            updateJoystick(e);
        }
    );


    /* =========================================
       조이스틱 손 떼기
    ========================================= */

    joystick.addEventListener(
        "pointerup",
        releaseJoystick
    );

    joystick.addEventListener(
        "pointercancel",
        releaseJoystick
    );


    function releaseJoystick(e) {

        if (
            e.pointerId !==
            joystickPointerId
        ) {
            return;
        }

        joystickActive = false;

        joystickPointerId = null;

        joystickX = 0;

        joystickY = 0;


        joystickKnob.style.transform =
            "translate(-50%, -50%)";
    }


    /* =========================================
       조이스틱 계산
    ========================================= */

    function updateJoystick(e) {

        const rect =
            joystick.getBoundingClientRect();


        const centerX =
            rect.left +
            rect.width / 2;

        const centerY =
            rect.top +
            rect.height / 2;


        let dx =
            e.clientX - centerX;

        let dy =
            e.clientY - centerY;


        let distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        /* 조이스틱 범위를 벗어나지 않게 함 */

        if (
            distance >
            joystickRadius
        ) {

            dx =
                dx /
                distance *
                joystickRadius;

            dy =
                dy /
                distance *
                joystickRadius;
        }


        /* 방향 계산 */

        if (distance > 5) {

            joystickX =
                dx /
                joystickRadius;

            joystickY =
                dy /
                joystickRadius;

        } else {

            joystickX = 0;

            joystickY = 0;
        }


        /* 손잡이 이동 */

        joystickKnob.style.transform =
            `translate(
                calc(-50% + ${dx}px),
                calc(-50% + ${dy}px)
            )`;
    }


    /* =========================================
       패링 버튼
    ========================================= */

    parryButton.addEventListener(
        "pointerdown",
        function(e) {

            e.preventDefault();

            if (
                !isGameStarted ||
                isGameOver
            ) {
                return;
            }

            if (!parry.cooldown) {

                activateParry();
            }
        }
    );


    function activateParry() {

        parry.active = true;

        parry.cooldown = true;

        parry.rewarded = false;

        parry.timer =
            parry.duration;

        parry.cdTimer =
            parry.cooldownTime;
    }


    /* =========================================
       탄환 생성
    ========================================= */

    function spawnBullet() {

        if (
            !isGameStarted ||
            isGameOver
        ) {
            return;
        }


        bullets.push({

            x:
                Math.random() *
                canvas.width,

            y: 0,

            radius: 4,

            speed:
                3 +
                Math.random() * 4
        });
    }


    /* =========================================
       게임 업데이트
    ========================================= */

    function update() {

        if (
            !isGameStarted ||
            isGameOver
        ) {
            return;
        }


        /* 점수 */

        score++;


        /* =====================================
           패링 시간
        ===================================== */

        if (parry.active) {

            parry.timer--;

            if (
                parry.timer <= 0
            ) {

                parry.active = false;
            }
        }


        /* =====================================
           패링 쿨다운
        ===================================== */

        if (parry.cooldown) {

            parry.cdTimer--;

            if (
                parry.cdTimer <= 0
            ) {

                parry.cooldown = false;
            }
        }


        /* =====================================
           콤보 시간
        ===================================== */

        if (
            parry.comboTimer > 0
        ) {

            parry.comboTimer--;

            if (
                parry.comboTimer <= 0
            ) {

                parry.combo = 0;
            }
        }


        /* =====================================
           플레이어 이동

           ★ 중요 ★

           조이스틱을 얼마나 당겼는지는
           속도에 영향을 주지 않는다.

           조이스틱은 방향만 결정하고,

           실제 이동 속도는 항상
           player.speed = 5

           로 유지된다.
        ===================================== */

        const joystickDeadZone =
            0.2;


        const joystickLength =
            Math.sqrt(
                joystickX * joystickX +
                joystickY * joystickY
            );


        if (
            joystickLength >
            joystickDeadZone
        ) {

            const directionX =
                joystickX /
                joystickLength;

            const directionY =
                joystickY /
                joystickLength;


            player.x +=
                directionX *
                player.speed;

            player.y +=
                directionY *
                player.speed;
        }


        /* =====================================
           플레이어 화면 밖 방지
        ===================================== */

        if (
            player.x <
            player.radius
        ) {

            player.x =
                player.radius;
        }


        if (
            player.x >
            canvas.width -
            player.radius
        ) {

            player.x =
                canvas.width -
                player.radius;
        }


        if (
            player.y <
            player.radius
        ) {

            player.y =
                player.radius;
        }


        if (
            player.y >
            canvas.height -
            player.radius
        ) {

            player.y =
                canvas.height -
                player.radius;
        }


        /* =====================================
           탄환
        ===================================== */

        for (
            let i =
                bullets.length - 1;
            i >= 0;
            i--
        ) {

            const bullet =
                bullets[i];


            bullet.y +=
                bullet.speed;


            const dx =
                player.x -
                bullet.x;

            const dy =
                player.y -
                bullet.y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            /* =================================
               패링 성공
            ================================= */

            if (
                parry.active &&
                distance <
                parry.radius +
                bullet.radius
            ) {

                bullets.splice(i, 1);


                if (
                    !parry.rewarded
                ) {

                    parry.rewarded =
                        true;


                    if (
                        parry.combo < 5
                    ) {

                        parry.combo++;
                    }


                    parry.comboTimer =
                        parry.maxComboTimer;


                    const points =
                        200 *
                        parry.combo;


                    score +=
                        points;


                    scorePopups.push({

                        x: bullet.x,

                        y: bullet.y,

                        text:
                            `+${points} (${parry.combo} STACK!)`,

                        life: 30
                    });
                }

                continue;
            }


            /* =================================
               플레이어 피격
            ================================= */

            if (
                distance <
                player.radius +
                bullet.radius
            ) {

                gameOver();

                return;
            }
        }


        /* =====================================
           화면 밖 탄환 삭제
        ===================================== */

        bullets =
            bullets.filter(
                function(bullet) {

                    return (
                        bullet.y <
                        canvas.height
                    );
                }
            );


        /* =====================================
           점수 팝업
        ===================================== */

        for (
            let i =
                scorePopups.length - 1;
            i >= 0;
            i--
        ) {

            scorePopups[i].y -= 1;

            scorePopups[i].life--;


            if (
                scorePopups[i].life <= 0
            ) {

                scorePopups.splice(i, 1);
            }
        }


        /* 화면 그리기 */

        draw();


        requestAnimationFrame(update);
    }


    /* =========================================
       화면 그리기
    ========================================= */

    function draw() {

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        /* =====================================
           패링 범위
        ===================================== */

        if (parry.active) {

            ctx.beginPath();

            ctx.arc(
                player.x,
                player.y,
                parry.radius,
                0,
                Math.PI * 2
            );


            ctx.fillStyle =
                "rgba(180, 0, 255, 0.4)";

            ctx.fill();


            ctx.strokeStyle =
                "#d8b4fe";

            ctx.lineWidth = 2;

            ctx.stroke();
        }


        /* =====================================
           플레이어
        ===================================== */

        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y,
            player.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#00ffff";

        ctx.fill();


        /* =====================================
           탄환
        ===================================== */

        ctx.fillStyle =
            "#ff4444";


        bullets.forEach(
            function(bullet) {

                ctx.beginPath();

                ctx.arc(
                    bullet.x,
                    bullet.y,
                    bullet.radius,
                    0,
                    Math.PI * 2
                );

                ctx.fill();
            }
        );


        /* =====================================
           점수 팝업
        ===================================== */

        scorePopups.forEach(
            function(popup) {

                ctx.fillStyle =
                    "#ffff00";

                ctx.font =
                    "bold 13px sans-serif";

                ctx.fillText(
                    popup.text,
                    popup.x - 30,
                    popup.y
                );
            }
        );


        /* =====================================
           점수
        ===================================== */

        ctx.fillStyle =
            "#ffffff";

        ctx.font =
            "16px monospace";

        ctx.fillText(
            "SCORE: " + score,
            15,
            30
        );


        /* =====================================
           패링 상태
        ===================================== */

        if (
            parry.cooldown
        ) {

            ctx.fillStyle =
                "#ff6666";

            ctx.fillText(
                "PARRY: RECHARGING...",
                15,
                55
            );

        } else {

            ctx.fillStyle =
                "#00ffcc";

            ctx.fillText(
                "PARRY: READY",
                15,
                55
            );
        }


        /* =====================================
           콤보
        ===================================== */

        if (
            parry.combo > 0
        ) {

            ctx.fillStyle =
                "#ff00ff";

            ctx.font =
                "bold 14px monospace";

            ctx.fillText(
                `COMBO: ${parry.combo}/5 STACK`,
                15,
                80
            );


            const barWidth =
                (
                    parry.comboTimer /
                    parry.maxComboTimer
                ) * 100;


            ctx.fillStyle =
                "#ff00ff";

            ctx.fillRect(
                15,
                88,
                barWidth,
                4
            );
        }
    }


    /* =========================================
       탄환 생성 속도
    ========================================= */

    setInterval(
        spawnBullet,
        110
    );


    /* =========================================
       게임 시작 전 화면
    ========================================= */

    draw();

</script>

</body>
</html>
