<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

    <title>탄막 게임 Mobile</title>

    <style>

        * {
            box-sizing: border-box;
            touch-action: none;
        }

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #111;

        }


        /* 게임 전체 */

        #gameContainer {

            position: relative;

            width: 400px;
            height: 500px;

            max-width: 100vw;
            max-height: 100vh;

            margin: auto;

        }


        /* 게임 화면 */

        canvas {

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            background: #0d0d0d;

            border: 2px solid white;

            display: block;

        }


        /* =========================
           START 화면
        ========================= */

        #startScreen {

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            background:
                rgba(0,0,0,0.75);

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            z-index: 20;

        }


        #gameTitle {

            color: white;

            font-size: 32px;

            font-weight: bold;

            margin-bottom: 35px;

            text-shadow:
                0 0 10px #00ffff;

        }


        #startButton {

            width: 180px;
            height: 60px;

            border: 3px solid #d8b4fe;

            border-radius: 12px;

            background: #6a00ff;

            color: white;

            font-size: 22px;

            font-weight: bold;

        }


        #startButton:active {

            transform: scale(0.94);

        }


        /* =========================
           조이스틱
        ========================= */

        #joystick {

            position: absolute;

            left: 20px;
            bottom: 20px;

            width: 120px;
            height: 120px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.15);

            border:
                4px solid
                rgba(255,255,255,0.45);

            z-index: 10;

            display: none;

        }


        #joystickKnob {

            position: absolute;

            left: 50%;
            top: 50%;

            width: 60px;
            height: 60px;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                rgba(0,255,255,0.8);

            border:
                3px solid #00ffff;

            box-shadow:
                0 0 15px
                rgba(0,255,255,0.7);

        }


        /* =========================
           PARRY 버튼
        ========================= */

        #parryButton {

            position: absolute;

            right: 20px;
            bottom: 25px;

            width: 100px;
            height: 100px;

            border-radius: 50%;

            border:
                4px solid #d8b4fe;

            background:
                rgba(120,0,255,0.8);

            color: white;

            font-size: 17px;

            font-weight: bold;

            z-index: 10;

            display: none;

        }


        #parryButton:active {

            transform: scale(0.9);

            background:
                rgba(220,0,255,0.9);

        }


        /* =========================
           게임 오버
        ========================= */

        #gameOverScreen {

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            background:
                rgba(0,0,0,0.8);

            display: none;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            z-index: 20;

        }


        #gameOverTitle {

            color: #ff4444;

            font-size: 32px;

            font-weight: bold;

            margin-bottom: 15px;

        }


        #finalScore {

            color: white;

            font-size: 20px;

            margin-bottom: 25px;

        }


        #restartButton {

            width: 170px;
            height: 55px;

            border: 3px solid #d8b4fe;

            border-radius: 10px;

            background: #6a00ff;

            color: white;

            font-size: 20px;

            font-weight: bold;

        }


        #restartButton:active {

            transform: scale(0.94);

        }

    </style>

</head>


<body>


<div id="gameContainer">


    <!-- 게임 화면 -->

    <canvas
        id="gameCanvas"
        width="400"
        height="500">
    </canvas>


    <!-- =====================
         START 화면
    ====================== -->

    <div id="startScreen">

        <div id="gameTitle">
            BULLET HELL
        </div>

        <button id="startButton">
            START GAME
        </button>

    </div>


    <!-- =====================
         조이스틱
    ====================== -->

    <div id="joystick">

        <div id="joystickKnob"></div>

    </div>


    <!-- =====================
         패링 버튼
    ====================== -->

    <button id="parryButton">
        PARRY
    </button>


    <!-- =====================
         게임 오버
    ====================== -->

    <div id="gameOverScreen">

        <div id="gameOverTitle">
            GAME OVER
        </div>

        <div id="finalScore">
            최종 점수: 0
        </div>

        <button id="restartButton">
            RESTART
        </button>

    </div>


</div>


<script>


    // =========================================
    // HTML 요소
    // =========================================

    const canvas =
        document.getElementById(
            "gameCanvas"
        );

    const ctx =
        canvas.getContext("2d");


    const startScreen =
        document.getElementById(
            "startScreen"
        );


    const startButton =
        document.getElementById(
            "startButton"
        );


    const joystick =
        document.getElementById(
            "joystick"
        );


    const joystickKnob =
        document.getElementById(
            "joystickKnob"
        );


    const parryButton =
        document.getElementById(
            "parryButton"
        );


    const gameOverScreen =
        document.getElementById(
            "gameOverScreen"
        );


    const finalScore =
        document.getElementById(
            "finalScore"
        );


    const restartButton =
        document.getElementById(
            "restartButton"
        );



    // =========================================
    // 플레이어
    // =========================================

    let player = {

        x: 200,

        y: 450,

        radius: 8,

        speed: 5

    };



    // =========================================
    // 게임 변수
    // =========================================

    let bullets = [];

    let scorePopups = [];

    let score = 0;

    let isGameStarted = false;

    let isGameOver = false;



    // =========================================
    // 조이스틱 변수
    // =========================================

    let joystickX = 0;

    let joystickY = 0;

    let joystickActive = false;

    let joystickTouchId = null;



    const joystickMax =
        40;



    // =========================================
    // 패링
    // =========================================

    let parry = {

        active: false,

        cooldown: false,

        rewarded: false,

        radius: 20,

        duration: 7,

        cooldownTime: 70,

        timer: 0,

        cdTimer: 0,

        combo: 0,

        comboTimer: 0,

        maxComboTimer: 210

    };



    // =========================================
    // START 버튼
    // =========================================

    startButton.addEventListener(
        "click",
        function() {

            startGame();

        }
    );



    // =========================================
    // 게임 시작
    // =========================================

    function startGame() {

        isGameStarted = true;

        isGameOver = false;


        startScreen.style.display =
            "none";


        gameOverScreen.style.display =
            "none";


        joystick.style.display =
            "block";


        parryButton.style.display =
            "block";


        resetGame();

    }



    // =========================================
    // 게임 초기화
    // =========================================

    function resetGame() {

        player.x = 200;

        player.y = 450;


        bullets = [];

        scorePopups = [];

        score = 0;


        isGameOver = false;


        parry.active = false;

        parry.cooldown = false;

        parry.rewarded = false;

        parry.timer = 0;

        parry.cdTimer = 0;

        parry.combo = 0;

        parry.comboTimer = 0;


        resetJoystick();


        gameOverScreen.style.display =
            "none";


        joystick.style.display =
            "block";


        parryButton.style.display =
            "block";


        update();

    }



    // =========================================
    // 조이스틱
    // =========================================

    joystick.addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();


            if (
                !isGameStarted ||
                isGameOver
            ) {
                return;
            }


            const touch =
                e.changedTouches[0];


            joystickActive = true;

            joystickTouchId =
                touch.identifier;


            moveJoystick(touch);

        },
        { passive: false }
    );



    joystick.addEventListener(
        "touchmove",
        function(e) {

            e.preventDefault();


            if (!joystickActive) {
                return;
            }


            for (
                let i = 0;
                i < e.changedTouches.length;
                i++
            ) {

                const touch =
                    e.changedTouches[i];


                if (
                    touch.identifier ===
                    joystickTouchId
                ) {

                    moveJoystick(touch);

                    break;

                }

            }

        },
        { passive: false }
    );



    joystick.addEventListener(
        "touchend",
        function(e) {

            for (
                let i = 0;
                i < e.changedTouches.length;
                i++
            ) {

                if (
                    e.changedTouches[i]
                        .identifier ===
                    joystickTouchId
                ) {

                    resetJoystick();

                }

            }

        }
    );



    joystick.addEventListener(
        "touchcancel",
        function() {

            resetJoystick();

        }
    );



    // =========================================
    // 조이스틱 움직임 계산
    // =========================================

    function moveJoystick(touch) {

        const rect =
            joystick.getBoundingClientRect();


        const centerX =
            rect.left +
            rect.width / 2;


        const centerY =
            rect.top +
            rect.height / 2;


        let dx =
            touch.clientX -
            centerX;


        let dy =
            touch.clientY -
            centerY;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (
            distance >
            joystickMax
        ) {

            dx =
                dx / distance *
                joystickMax;


            dy =
                dy / distance *
                joystickMax;

        }


        // 손잡이 위치

        joystickKnob.style.left =
            `calc(50% + ${dx}px)`;


        joystickKnob.style.top =
            `calc(50% + ${dy}px)`;


        // 이동 방향

        joystickX =
            dx / joystickMax;


        joystickY =
            dy / joystickMax;

    }



    // =========================================
    // 조이스틱 리셋
    // =========================================

    function resetJoystick() {

        joystickActive = false;

        joystickTouchId = null;


        joystickX = 0;

        joystickY = 0;


        joystickKnob.style.left =
            "50%";


        joystickKnob.style.top =
            "50%";

    }



    // =========================================
    // 패링 버튼
    // =========================================

    parryButton.addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();


            if (
                isGameStarted &&
                !isGameOver &&
                !parry.cooldown
            ) {

                activateParry();

            }

        },
        { passive: false }
    );



    // PC 테스트용

    parryButton.addEventListener(
        "click",
        function() {

            if (
                isGameStarted &&
                !isGameOver &&
                !parry.cooldown
            ) {

                activateParry();

            }

        }
    );



    // =========================================
    // 패링
    // =========================================

    function activateParry() {

        parry.active = true;

        parry.cooldown = true;

        parry.rewarded = false;


        parry.timer =
            parry.duration;


        parry.cdTimer =
            parry.cooldownTime;

    }



    // =========================================
    // 탄막 생성
    // =========================================

    function spawnBullet() {

        if (
            !isGameStarted ||
            isGameOver
        ) {

            return;

        }


        bullets.push({

            x:
                Math.random()
                * canvas.width,

            y: 0,

            radius: 4,

            speed:
                3 +
                Math.random() * 4

        });

    }



    // =========================================
    // 게임 업데이트
    // =========================================

    function update() {

        if (
            !isGameStarted ||
            isGameOver
        ) {

            return;

        }


        // 점수

        score++;



        // =====================================
        // 조이스틱으로 플레이어 이동
        // =====================================

        player.x +=
            joystickX *
            player.speed;


        player.y +=
            joystickY *
            player.speed;


        // 화면 밖 방지

        player.x =
            Math.max(
                player.radius,

                Math.min(
                    canvas.width -
                    player.radius,

                    player.x
                )
            );


        player.y =
            Math.max(
                player.radius,

                Math.min(
                    canvas.height -
                    player.radius,

                    player.y
                )
            );



        // =====================================
        // 패링 지속시간
        // =====================================

        if (parry.active) {

            parry.timer--;


            if (
                parry.timer <= 0
            ) {

                parry.active = false;

            }

        }



        // =====================================
        // 패링 쿨다운
        // =====================================

        if (parry.cooldown) {

            parry.cdTimer--;


            if (
                parry.cdTimer <= 0
            ) {

                parry.cooldown = false;

            }

        }



        // =====================================
        // 콤보
        // =====================================

        if (
            parry.comboTimer > 0
        ) {

            parry.comboTimer--;


            if (
                parry.comboTimer <= 0
            ) {

                parry.combo = 0;

            }

        }



        // =====================================
        // 탄막
        // =====================================

        for (
            let i =
                bullets.length - 1;

            i >= 0;

            i--
        ) {

            const bullet =
                bullets[i];


            bullet.y +=
                bullet.speed;


            const dx =
                player.x -
                bullet.x;


            const dy =
                player.y -
                bullet.y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );



            // 패링

            if (
                parry.active &&
                distance <
                parry.radius +
                bullet.radius
            ) {

                bullets.splice(i, 1);


                if (
                    !parry.rewarded
                ) {

                    parry.rewarded =
                        true;


                    if (
                        parry.combo < 5
                    ) {

                        parry.combo++;

                    }


                    parry.comboTimer =
                        parry.maxComboTimer;


                    const points =
                        200 *
                        parry.combo;


                    score += points;


                    scorePopups.push({

                        x: bullet.x,

                        y: bullet.y,

                        text:
                            `+${points} (${parry.combo} STACK!)`,

                        life: 30

                    });

                }


                continue;

            }



            // 플레이어 충돌

            if (
                distance <
                player.radius +
                bullet.radius
            ) {

                gameOver();

            }

        }



        // 화면 아래 탄 제거

        bullets =
            bullets.filter(
                function(bullet) {

                    return (
                        bullet.y <
                        canvas.height
                    );

                }
            );



        // 점수 팝업

        for (
            let i =
                scorePopups.length - 1;

            i >= 0;

            i--
        ) {

            scorePopups[i].y--;

            scorePopups[i].life--;


            if (
                scorePopups[i].life <= 0
            ) {

                scorePopups.splice(i, 1);

            }

        }



        draw();


        requestAnimationFrame(
            update
        );

    }



    // =========================================
    // 게임 오버
    // =========================================

    function gameOver() {

        isGameOver = true;


        resetJoystick();


        joystick.style.display =
            "none";


        parryButton.style.display =
            "none";


        finalScore.textContent =
            "최종 점수: " + score;


        gameOverScreen.style.display =
            "flex";

    }



    // =========================================
    // 화면 그리기
    // =========================================

    function draw() {

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        // 패링 쉴드

        if (parry.active) {

            ctx.beginPath();


            ctx.arc(
                player.x,
                player.y,
                parry.radius,
                0,
                Math.PI * 2
            );


            ctx.fillStyle =
                "rgba(180,0,255,0.4)";


            ctx.fill();


            ctx.strokeStyle =
                "#d8b4fe";


            ctx.lineWidth = 2;


            ctx.stroke();

        }



        // 플레이어

        ctx.beginPath();


        ctx.arc(
            player.x,
            player.y,
            player.radius,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            "#00ffff";


        ctx.fill();



        // 탄막

        ctx.fillStyle =
            "#ff4444";


        bullets.forEach(
            function(bullet) {

                ctx.beginPath();


                ctx.arc(
                    bullet.x,
                    bullet.y,
                    bullet.radius,
                    0,
                    Math.PI * 2
                );


                ctx.fill();

            }
        );



        // 점수 팝업

        scorePopups.forEach(
            function(popup) {

                ctx.fillStyle =
                    "#ffff00";


                ctx.font =
                    "bold 13px sans-serif";


                ctx.fillText(
                    popup.text,
                    popup.x - 30,
                    popup.y
                );

            }
        );



        // 점수

        ctx.fillStyle =
            "#ffffff";


        ctx.font =
            "16px monospace";


        ctx.fillText(
            "SCORE: " + score,
            15,
            30
        );



        // 패링 상태

        if (parry.cooldown) {

            ctx.fillStyle =
                "#ff6666";


            ctx.fillText(
                "PARRY: RECHARGING...",
                15,
                55
            );

        }
        else {

            ctx.fillStyle =
                "#00ffcc";


            ctx.fillText(
                "PARRY: READY",
                15,
                55
            );

        }



        // 콤보

        if (
            parry.combo > 0
        ) {

            ctx.fillStyle =
                "#ff00ff";


            ctx.font =
                "bold 14px monospace";


            ctx.fillText(
                `COMBO: ${parry.combo}/5 STACK`,
                15,
                80
            );


            const barWidth =
                (
                    parry.comboTimer /
                    parry.maxComboTimer
                ) * 100;


            ctx.fillRect(
                15,
                88,
                barWidth,
                4
            );

        }

    }



    // =========================================
    // RESTART
    // =========================================

    restartButton.addEventListener(
        "click",
        function() {

            resetGame();

        }
    );



    // =========================================
    // 탄막 생성
    // =========================================

    setInterval(
        spawnBullet,
        100
    );



    // =========================================
    // 최초 화면
    // =========================================

    draw();

</script>

</body>

</html>
